function addCustom(){if(!$('customname').value.trim()||!positive('labelweight')||!valid(['lc','lp','lb','lf']))return alert('Enter label weight and all nutrition values.');let g=num('labelweight');s.customFoods.push([$('customname').value.trim(),...['lc','lp','lb','lf'].map(x=>num(x)*100/g)]);save();render()}
function scaleItems(r,factor){return r.items.map(([i,g])=>[i,Math.round(g*factor*10)/10])}
function planFor(d,seed=0){let rs=allRecipes(), fractions=[.24,.29,.34,.13];return groups.map((m,j)=>{let ids=rs.map((r,i)=>r.meal===m?i:-1).filter(i=>i>=0),i=ids[(seed+j)%ids.length],r=rs[i],factor=s.targets.cal*fractions[j]/nutrients(r.items)[0];return {i,factor:Math.round(factor*100)/100}})}
function getMeals(d){if(!s.nutPlans[d])s.nutPlans[d]=planFor(d,new Date(d+'T12:00:00').getDate());return s.nutPlans[d]}
function changeMeal(j){let a=getMeals(date()),rs=allRecipes(),ids=rs.map((r,i)=>r.meal===groups[j]?i:-1).filter(i=>i>=0),i=ids[(ids.indexOf(a[j].i)+1)%ids.length];a[j]={i,factor:Math.round(s.targets.cal*[.24,.29,.34,.13][j]/nutrients(rs[i].items)[0]*100)/100};save();render()}
function regenerate(){s.nutPlans[date()]=planFor(date(),Math.floor(Math.random()*1000));save();render()}
function logPlan(j){let x=getMeals(date())[j],r=allRecipes()[x.i];if(confirm('Log this planned portion as eaten?')){pushNutrition(r.name+' · planned portion',r.meal,nutrients(scaleItems(r,x.factor)));render()}}
function recipeCard(r,i,factor=1,planIndex=null){let items=scaleItems(r,factor),a=nutrients(items);return `<div class="recipe"><b>${esc(r.name)}</b><p class="muted">${esc(r.cuisine)} · ${esc(r.meal)} · ${fmt(a)}</p><details><summary>Ingredients & cooking instructions</summary>${items.map(([j,g])=>`<div class="line"><small>${esc(library()[j][0])}</small><span>${g} g / ${(g/28.3495).toFixed(1)} oz</span></div>`).join('')}<p>${esc(r.method)}</p><small>Weigh as listed. Water and dry spices not counted. Scale ingredients for meal prep; cooking time may vary.</small></details><div class="actions">${planIndex!==null?`<button onclick="logPlan(${planIndex})">Log eaten</button><button onclick="changeMeal(${planIndex})">Swap</button>`:`<button onclick="logRecipe(${i})">Log serving</button>`}<button onclick="favorite(${i})">${s.favorites.includes(i)?'Saved ★':'Save ☆'}</button></div></div>`}
function favorite(i){s.favorites=s.favorites.includes(i)?s.favorites.filter(x=>x!==i):s.favorites.concat(i);save();render()}
function logRecipe(i){let r=allRecipes()[i];let n=Number(prompt('How many servings did you eat?','1'));if(n>0&&Number.isFinite(n)){pushNutrition(r.name+' × '+n,r.meal,nutrients(scaleItems(r,n)));render()}}
function nextDay(d,n){let t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`}
function showWeek(){week=Array.from({length:7},(_,i)=>{let d=nextDay(date(),i);return {d,meals:getMeals(d)}});save();render()}
function weekHTML(){if(!week)return '';let totals={};return `<section><h2>Seven-day plan</h2>${week.map(({d})=>{let a=getMeals(d);a.forEach(x=>scaleItems(allRecipes()[x.i],x.factor).forEach(([i,g])=>totals[i]=(totals[i]||0)+g));return `<details><summary>${d} · ${Math.round(a.reduce((t,x)=>t+nutrients(scaleItems(allRecipes()[x.i],x.factor))[0],0))} kcal</summary>${a.map(x=>`<p>${esc(allRecipes()[x.i].meal)}: ${esc(allRecipes()[x.i].name)}</p>`).join('')}<button onclick="$('day').value='${d}';render()">Open day</button></details>`}).join('')}<h2>Grocery list</h2><p class="muted">Quantities for one person, all seven days. Raw/dry weights where specified; cooked beans are drained weights. Round up to package sizes.</p>${Object.entries(totals).map(([i,g])=>`<label class="grocery"><input type="checkbox"> ${esc(library()[i][0])} — ${Math.ceil(g)} g (${(g/453.592).toFixed(2)} lb)</label>`).join('')}</section>`}
function draftAdd(){if(!positive('draftgrams'))return alert('Enter ingredient weight.');draft.push([num('draftfood'),num('draftgrams')]);render()}
function draftSave(){if(!draft.length||!$('recname').value.trim()||!positive('servings'))return alert('Add ingredients, recipe name and servings.');let n=num('servings');s.customRecipes.push(R($('recname').value.trim(),$('recmeal').value,'Custom',draft.map(([i,g])=>[i,g/n]),$('method').value));draft=[];save();render()}
function batchCalc(){let r=allRecipes()[num('batchrecipe')];if(!positive('batchservings')||!positive('batchweight')||!positive('batchportion')||num('batchportion')>num('batchweight'))return alert('Enter valid batch weights and portion no larger than batch.');let f=num('batchservings')*num('batchportion')/num('batchweight');let a=nutrients(scaleItems(r,f));$('batchresult').textContent=fmt(a);$('batchlog').disabled=false}
function batchLog(){let r=allRecipes()[num('batchrecipe')];if(!positive('batchservings')||!positive('batchweight')||!positive('batchportion')||num('batchportion')>num('batchweight'))return alert('Check weights.');pushNutrition(r.name+' · '+num('batchportion')+' g cooked batch',r.meal,nutrients(scaleItems(r,num('batchservings')*num('batchportion')/num('batchweight'))));render()}
function nutrition(){let a=getMeals(date()),rs=allRecipes(),planned=a.reduce((t,x)=>t.map((v,j)=>v+nutrients(scaleItems(rs[x.i],x.factor))[j]),[0,0,0,0]);return `<section><small>NUTRITION STUDIO</small><h2>Daily nutrition</h2>${bars()}<p>Budget meals · Mexican, American & Italian · No fish or cheese-heavy recipes</p></section><section><h2>Today's meal plan</h2><p>Planned: ${fmt(planned)}. Portions are scaled to your calorie target; macros may differ. Log only what you actually eat.</p>${a.map((x,j)=>recipeCard(rs[x.i],x.i,x.factor,j)).join('')}<div class="actions"><button onclick="regenerate()">New day plan</button><button onclick="showWeek()">7-day plan & groceries</button></div></section>${weekHTML()}<section><h2>Weigh & log food</h2>${field('searchfood','Search food',foodQuery,'text')}<label>Food / preparation state</label><select id="foodpick" onchange="previewFood()">${foodOpts(foodQuery)}</select><div class="grid">${field('grams','Scale weight',100)}<div><label>Unit</label><select id="unit" onchange="previewFood()"><option>g</option><option>oz</option></select></div></div><label>Meal</label><select id="mealpick">${options(groups)}</select><p id="foodpreview" class="result"></p><button class="full" onclick="logPortion()">Log weighed food</button><p class="muted">Generic estimates per 100 g. Use package labels for branded foods. Match raw/dry or cooked state; tare your scale first.</p></section><section><h2>Food diary</h2>${s.food.map((x,i)=>x.date===date()?`<div class="line"><div>${esc(x.name)}<br><small>${esc(x.meal)} · ${fmt(keys.map(k=>x[k]))}</small></div><button onclick="del('food',${i})">Remove</button></div>`:'').join('')||'<p>No food logged.</p>'}</section><section><h2>Recipe library</h2><label>Filter</label><select onchange="recipeFilter=this.value;render()">${['All','Favorites',...groups,'Mexican','American','Italian','Custom'].map(x=>`<option ${recipeFilter===x?'selected':''}>${x}</option>`).join('')}</select>${rs.map((r,i)=>recipeFilter==='All'||recipeFilter===r.meal||recipeFilter===r.cuisine||(recipeFilter==='Favorites'&&s.favorites.includes(i))?recipeCard(r,i):'').join('')}</section><section><h2>Build your own recipe</h2><label>Ingredient</label><select id="draftfood">${foodOpts()}</select>${field('draftgrams','Ingredient weight (g)',100)}<button class="full" onclick="draftAdd()">Add ingredient</button>${draft.map(([i,g],j)=>`<div class="line">${esc(library()[i][0])} · ${g} g <button onclick="draft.splice(${j},1);render()">Remove</button></div>`).join('')}<p>${fmt(nutrients(draft))} total batch</p>${field('recname','Recipe name','','text')}<label>Meal</label><select id="recmeal">${options(groups)}</select>${field('servings','Number of servings',1)}<label>Cooking instructions</label><textarea id="method" rows="3"></textarea><button class="full" onclick="draftSave()">Save recipe</button></section><section><h2>Meal prep / cooked batch</h2><label>Recipe</label><select id="batchrecipe">${rs.map((r,i)=>`<option value="${i}">${esc(r.name)}</option>`).join('')}</select>${field('batchservings','Recipe servings cooked',4)}${field('batchweight','Entire cooked batch weight (g)',1600)}${field('batchportion','Your portion weight (g)',400)}<button class="full" onclick="batchCalc()">Calculate portion</button><p id="batchresult" class="result"></p><button id="batchlog" onclick="batchLog()">Log batch portion</button><p class="muted">Assumes even distribution of ingredients. Weigh the cooked batch without the container.</p></section><section><h2>Save a food from its label</h2>${field('customname','Food name / preparation state','','text')}${field('labelweight','Label serving size (g)',100)}<div class="grid">${field('lc','Calories')}${field('lp','Protein (g)')}${field('lb','Carbs (g)')}${field('lf','Fat (g)')}</div><button class="full" onclick="addCustom()">Save to food library</button></section>`}
document.addEventListener('input',e=>{if(e.target.id==='searchfood')searchFood();if(e.target.id==='grams')previewFood()});

$('day').onchange=render;render();</script></body></html>
