<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Fitness Coach</title><style>
*{box-sizing:border-box}body{margin:0;background:#101714;color:#e8eee9;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:20px 16px 80px}h1{font-size:28px;margin:5px 0}h2{font-size:19px}small,p{color:#aab9b0}section{background:#1b2721;border:1px solid #34453b;border-radius:16px;padding:16px;margin:14px 0}nav{display:flex;gap:6px;flex-wrap:wrap}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #486052}button{background:#a8e5b5;color:#14271b;font-weight:650;cursor:pointer}nav button{background:#26392e;color:#d8e8dc}nav button.active{background:#a8e5b5;color:#14271b}input,select{background:#111c16;color:#fff;min-width:0;width:100%}label{display:block;font-size:13px;color:#b7c7bd;margin:8px 0 4px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{background:#111c16;padding:12px;border-radius:10px}.stat b{display:block;font-size:24px}.bar{height:8px;background:#34453b;border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;background:#a8e5b5;height:100%}.line{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #34453b;padding:10px 0}.line button{padding:5px 9px;background:#34453b;color:white}button.full{width:100%;margin-top:12px}.hidden{display:none}canvas{width:100%;height:180px} .muted{font-size:13px;color:#aab9b0} .warn{color:#e9c58b} input[type=file]{font-size:12px}</style></head><body><main><small>PERSONAL HEALTH / OFFLINE EDITION</small><h1>My Fitness Coach</h1><p>Build habits. Track progress. Get stronger.</p><label>Tracking date</label><input type="date" id="day"><nav id="nav"></nav><div id="view"></div></main><script>
const key='fitnessCoachV1', defaults={targets:{cal:1900,p:160,c:165,f:65,goal:215},food:[],work:[],body:[],activity:[],plan:{}};let s;try{s=JSON.parse(localStorage.getItem(key))||structuredClone(defaults)}catch(e){s=structuredClone(defaults)};const $=id=>document.getElementById(id),today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};$('day').value=today();let tab='Today';const date=()=>$('day').value;const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){alert('Storage unavailable. Export a backup before closing.')}}function num(id){return Number($(id).value)}function field(id,label,value='',type='number'){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(value)}">`}function totals(){return s.food.filter(x=>x.date===date()).reduce((a,x)=>{for(let k of ['cal','p','c','f'])a[k]+=x[k];return a},{cal:0,p:0,c:0,f:0})}function stat(label,v){return `<div class="stat"><small>${label}</small><b>${v}</b></div>`}function bars(){let t=totals();return ['cal','p','c','f'].map((k,i)=>`<small>${['Calories','Protein (g)','Carbs (g)','Fat (g)'][i]} — ${Math.round(t[k])} / ${s.targets[k]}</small><div class="bar"><i style="width:${Math.min(100,t[k]/s.targets[k]*100)}%"></i></div>`).join('')}
const foods=[['Eggs, 3 large',216,19,1,14],['Greek yogurt, plain nonfat, 170 g',100,17,6,0],['Whole wheat toast, 2 slices',160,8,28,2],['Chicken breast, cooked, 6 oz',280,53,0,6],['Rice, cooked, 1 cup',205,4,45,0],['Broccoli, cooked, 1 cup',55,4,11,1],['Lean steak, cooked, 6 oz',340,48,0,16],['Potato, baked, 250 g',230,6,52,0],['Olive oil, 1 tbsp',119,0,0,14],['Banana, medium',105,1,27,0],['Whey protein, 1 scoop',120,24,3,2],['Oats, dry, 40 g',150,5,27,3],['Tuna in water, drained, 1 can',130,29,0,1],['Tortilla, medium',140,4,24,4],['Black beans, cooked, 1/2 cup',114,8,20,0],['Apple, medium',95,0,25,0],['Salmon, cooked, 6 oz',350,37,0,21]];const recipes=[{name:'Eggs, toast & yogurt',meal:'Breakfast',items:[[0,1],[1,1],[2,1]]},{name:'Protein oats & banana',meal:'Breakfast',items:[[11,1],[10,1],[9,1],[1,1]]},{name:'Chicken rice bowl',meal:'Lunch',items:[[3,1],[4,1],[5,1],[8,.5]]},{name:'Tuna & bean wraps',meal:'Lunch',items:[[12,1],[13,2],[14,1]]},{name:'Steak, potato & broccoli',meal:'Dinner',items:[[6,1],[7,1],[5,1],[8,.5]]},{name:'Salmon rice bowl',meal:'Dinner',items:[[16,1],[4,1],[5,1]]},{name:'Yogurt, whey & apple',meal:'Snack',items:[[1,1],[10,1],[15,1]]}];function recipeTotal(r){return r.items.reduce((a,[i,n])=>a.map((v,j)=>v+foods[i][j+1]*n),[0,0,0,0])}function addRecipe(i){let r=recipes[i];r.items.forEach(([j,n])=>addFood(j,n,r.meal,false));save();render()}function addFood(i,n,meal,refresh=true){let f=foods[i];s.food.push({date:date(),name:f[0]+' × '+n,meal,cal:f[1]*n,p:f[2]*n,c:f[3]*n,f:f[4]*n});if(refresh){save();render()}}function del(type,i){s[type].splice(i,1);save();render()}function valid(ids){return ids.every(id=>$(id).value!==''&&Number.isFinite(num(id))&&num(id)>=0)}function logFood(){if(!$('fname').value.trim()||!valid(['fc','fp','fb','ff']))return alert('Enter a name and nonnegative nutrition values.');s.food.push({date:date(),name:$('fname').value,meal:$('meal').value,cal:num('fc'),p:num('fp'),c:num('fb'),f:num('ff')});save();render()}
const exercise=['Chair squats','Countertop push-ups','Glute bridges','Backpack rows','Standing calf raises','Bird dog','Walking'];function getPlan(){let weekday=new Date(date()+'T12:00:00').getDay();return [1,3,5].includes(weekday)?exercise.slice(0,4).concat('Bird dog'):['Walking','Gentle mobility']}
function logWork(){if(!$('ex').value.trim()||!valid(['sets','reps','load','mins']))return alert('Enter exercise and valid numbers.');s.work.push({date:date(),name:$('ex').value,sets:num('sets'),reps:num('reps'),load:num('load'),mins:num('mins')});save();render()}function logBody(){if(!valid(['weight'])||num('weight')<50||num('weight')>800)return alert('Enter a valid weight in pounds.');let optional=id=>$(id).value===''?null:num(id);if(['waist','bf','muscle'].some(id=>$(id).value!==''&&(!Number.isFinite(num(id))||num(id)<0))||num('bf')>100)return alert('Check measurements.');s.body=s.body.filter(x=>x.date!==date());s.body.push({date:date(),weight:num('weight'),waist:optional('waist'),bf:optional('bf'),muscle:optional('muscle')});save();render()}function logActivity(){if(!valid(['steps','sleep'])||num('sleep')>24)return alert('Check activity values.');s.activity=s.activity.filter(x=>x.date!==date());s.activity.push({date:date(),steps:num('steps'),sleep:num('sleep')});save();render()}
function chart(){let c=$('chart');if(!c)return;let a=s.body.slice().sort((a,b)=>a.date.localeCompare(b.date));let w=c.width=600,h=c.height=200,ctx=c.getContext('2d');ctx.fillStyle='#aab9b0';ctx.font='14px system-ui';if(!a.length){ctx.fillText('Log your first weigh-in to see your trend.',15,40);return}let lo=Math.min(s.targets.goal,...a.map(x=>x.weight))-2,hi=Math.max(...a.map(x=>x.weight))+2;let y=v=>15+(hi-v)/(hi-lo)*150;ctx.strokeStyle='#34453b';for(let j=0;j<=4;j++){let v=hi-(hi-lo)*j/4;ctx.beginPath();ctx.moveTo(45,y(v));ctx.lineTo(590,y(v));ctx.stroke();ctx.fillText(v.toFixed(0),2,y(v)+5)}ctx.strokeStyle='#a8e5b5';ctx.lineWidth=3;ctx.beginPath();a.forEach((x,i)=>{let xx=50+i*535/Math.max(1,a.length-1);i?ctx.lineTo(xx,y(x.weight)):ctx.moveTo(xx,y(x.weight))});ctx.stroke();a.forEach((x,i)=>{ctx.beginPath();ctx.arc(50+i*535/Math.max(1,a.length-1),y(x.weight),4,0,7);ctx.fillStyle='#a8e5b5';ctx.fill()});ctx.fillStyle='#aab9b0';ctx.fillText(a[0].date,45,190);if(a.length>1)ctx.fillText(a.at(-1).date,505,190)}
function render(){ $('nav').innerHTML=['Today','Meals','Workout','Progress','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()">${t}</button>`).join('');let t=totals(),b=s.body.slice().sort((a,b)=>a.date.localeCompare(b.date)),last=b.at(-1),a=s.activity.find(x=>x.date===date())||{};let v='';if(tab==='Today'){v=`<section><h2>Daily nutrition</h2><div class="grid">${stat('Calories remaining',Math.round(s.targets.cal-t.cal))}${stat('Protein logged',Math.round(t.p)+' g')}${stat('Latest weight',last?last.weight+' lb':'Not logged')}${stat('Workouts logged',s.work.filter(x=>x.date===date()).length+' exercises')}</div>${bars()}</section><section><h2>Activity & recovery</h2><div class="grid">${field('steps','Steps',a.steps??'')}${field('sleep','Sleep hours',a.sleep??'')}</div><button class="full" onclick="logActivity()">Save activity</button><p class="muted">Enter your Apple Watch totals manually. Start with a comfortable walking target.</p></section><section><h2>Today's plan</h2><p>${getPlan().join(' · ')}</p><button onclick="tab='Workout';render()">Open workout</button></section>`}if(tab==='Meals'){v=`<section><h2>Nutrition today</h2>${bars()}</section><section><h2>Meal ideas</h2><p class="muted">Choose a meal; portions and nutrition are estimates. Adjust to your remaining calories.</p>${recipes.map((r,i)=>{let a=recipeTotal(r);return `<div class="line"><div><b>${r.name}</b><br><small>${r.meal} · ${Math.round(a[0])} kcal · ${Math.round(a[1])} g protein<br>${r.items.map(([j,n])=>esc(foods[j][0])+' × '+n).join('; ')}</small></div><button onclick="addRecipe(${i})">Log</button></div>`}).join('')}</section><section><h2>Quick food log</h2><label>Meal</label><select id="quickmeal">${['Breakfast','Lunch','Dinner','Snack'].map(x=>`<option>${x}</option>`)}</select><label>Food</label><select id="food">${foods.map((f,i)=>`<option value="${i}">${f[0]} — ${f[1]} kcal</option>`)}</select>${field('portion','Servings',1)}<button class="full" onclick="if(valid(['portion'])&&num('portion')>0)addFood(num('food'),num('portion'),$('quickmeal').value)">Log food</button></section><section><h2>Custom food / nutrition label</h2>${field('fname','Food name','','text')}<label>Meal</label><select id="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select><div class="grid">${field('fc','Calories')}${field('fp','Protein (g)')}${field('fb','Carbs (g)')}${field('ff','Fat (g)')}</div><button class="full" onclick="logFood()">Save food</button></section><section><h2>Food diary</h2>${s.food.map((x,i)=>x.date===date()?`<div class="line"><div>${esc(x.name)}<br><small>${esc(x.meal)} · ${Math.round(x.cal)} kcal · ${Math.round(x.p)}g P / ${Math.round(x.c)}g C / ${Math.round(x.f)}g F</small></div><button onclick="del('food',${i})">Remove</button></div>`:'').join('')||'<p>No food logged.</p>'}</section>`}if(tab==='Workout'){v=`<section><h2>Daily workout plan</h2><p>Choose a comfortable effort. Rest 60–90 seconds between sets. Stop if you feel pain, dizziness or unusual breathlessness.</p>${getPlan().map(x=>`<div class="line"><div>${x}<br><small>${x==='Walking'?'20–30 minutes easy pace':x==='Gentle mobility'?'5–10 minutes':x==='Bird dog'?'2 sets × 6–8 per side':'2 sets × 8–12 reps'}</small></div><button onclick="$('ex').value='${x}';$('ex').scrollIntoView({behavior:'smooth'})">Log</button></div>`).join('')}</section><section><h2>Log workout</h2>${field('ex','Exercise','','text')}<div class="grid">${field('sets','Sets',2)}${field('reps','Reps per set',10)}${field('load','Added weight (lb)',0)}${field('mins','Duration (min)',0)}</div><button class="full" onclick="logWork()">Save exercise</button></section><section><h2>Workout history</h2>${s.work.map((x,i)=>`<div class="line"><div>${esc(x.name)}<br><small>${x.date} · ${x.sets} × ${x.reps} · ${x.load} lb · ${x.mins} min</small></div><button onclick="del('work',${i})">Remove</button></div>`).reverse().join('')||'<p>No workouts yet.</p>'}</section>`}if(tab==='Progress'){let d=b.length>1?last.weight-b[0].weight:0,avg=b.slice(-7).reduce((v,x)=>v+x.weight,0)/Math.max(1,b.slice(-7).length);v=`<section><h2>Weight trend</h2><div class="grid">${stat('Latest weight',last?last.weight+' lb':'—')}${stat('Net change',last?(d>0?'+':'')+d.toFixed(1)+' lb':'—')}${stat('Last 7 weigh-in average',last?avg.toFixed(1)+' lb':'—')}${stat('Goal',s.targets.goal+' lb')}</div><canvas id="chart"></canvas></section><section><h2>Body measurements</h2>${field('weight','Weight (lb)',last?.weight??'')}${field('waist','Waist (in), optional')}${field('bf','Body fat (%), optional')}${field('muscle','Muscle mass (lb), optional') }<p class="muted">Muscle mass and body fat are manually entered estimates from your scale or assessment. Weight and strength changes alone cannot quantify muscle gain.</p><button class="full" onclick="logBody()">Save measurements</button></section><section><h2>Measurement history</h2>${s.body.map((x,i)=>`<div class="line"><div>${x.date} · ${x.weight} lb<br><small>Waist ${x.waist??'—'} in · Fat ${x.bf??'—'}% · Muscle ${x.muscle??'—'} lb</small></div><button onclick="del('body',${i})">Remove</button></div>`).reverse().join('')||'<p>No measurements yet.</p>'}</section>`}if(tab==='Settings'){v=`<section><h2>Personal targets</h2><div class="grid">${field('tc','Calories',s.targets.cal)}${field('tp','Protein (g)',s.targets.p)}${field('tb','Carbs (g)',s.targets.c)}${field('tf','Fat (g)',s.targets.f)}${field('tg','Goal weight (lb)',s.targets.goal)}</div><button class="full" onclick="if(valid(['tc','tp','tb','tf','tg'])&&num('tc')>=1200&&num('tg')>=50){s.targets={cal:num('tc'),p:num('tp'),c:num('tb'),f:num('tf'),goal:num('tg')};save();render()}else alert('Review targets.')">Save targets</button><p class="muted">Starting targets are estimates, not medical advice. Adjust with your clinician if needed.</p></section><section><h2>Your data</h2><p>Data is stored in this browser only when local storage is available. No account or subscription. Export backups regularly.</p><button onclick="backup()">Export JSON backup</button><label>Restore backup (replaces current data)</label><input type="file" accept=".json,application/json" onchange="restore(this)"></section>`} $('view').innerHTML=v;chart()}
function backup(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fitness-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if(!x.targets||!['cal','p','c','f','goal'].every(k=>Number.isFinite(x.targets[k])&&x.targets[k]>0)||!['food','work','body','activity'].every(k=>Array.isArray(x[k])))throw Error();if(confirm('Replace current history with backup?')){s=x;save();render()}}catch(e){alert('Invalid backup.')}}$('day').onchange=render;render();</script></body></html>
